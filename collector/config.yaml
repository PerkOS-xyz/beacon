# Orrery OpenTelemetry Collector, day 1 skeleton.
# Accepts OTLP over HTTP and only runs a metrics pipeline. Traces and logs have
# no pipeline, so they are never stored.
# Later: tenant keys, spans converted to metrics and then dropped, Stellar-aware
# route normalization, and export to the ingest service.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]

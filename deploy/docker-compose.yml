# Beacon local and single-host stack.
# Run from the repo root: docker compose -f deploy/docker-compose.yml up -d --build
# Every image is pinned to a version. Upgrades are deliberate.

name: beacon

services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beacon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: umami
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d umami"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  umami:
    image: ghcr.io/umami-software/umami:3.4.1
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-beacon}:${POSTGRES_PASSWORD}@db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?Set UMAMI_APP_SECRET in deploy/.env}
      TWO_FACTOR_ENCRYPTION_KEY: ${UMAMI_TWO_FACTOR_KEY:?Set UMAMI_TWO_FACTOR_KEY in deploy/.env}
      DISABLE_TELEMETRY: "1"
    depends_on:
      db:
        condition: service_healthy
    init: true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  ingest:
    build:
      context: ../services/ingest
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-beacon}:${POSTGRES_PASSWORD}@db:5432/beacon
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    command: ["--config=/etc/beacon/collector.yaml"]
    volumes:
      - ../collector/config.yaml:/etc/beacon/collector.yaml:ro
    depends_on:
      ingest:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2.11.9-alpine
    ports:
      - "${BEACON_HTTP_PORT:-8080}:80"
      - "${BEACON_HTTPS_PORT:-8443}:443"
    environment:
      BEACON_UMAMI_SITE: ${BEACON_UMAMI_SITE:-http://analytics.localhost}
      BEACON_INGEST_SITE: ${BEACON_INGEST_SITE:-http://ingest.localhost}
      BEACON_OTLP_SITE: ${BEACON_OTLP_SITE:-http://otlp.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      umami:
        condition: service_healthy
      ingest:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  caddy-data:
